<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>GIPF — Proyectos</title>
</head>
<body>

<h1>Proyectos</h1>

<a th:href="@{/panel}">Panel principal</a> |
<a th:href="@{/proyectos/nuevo}">Nuevo proyecto</a>

<br><br>

<form th:action="@{/proyectos}" method="get">
    <input type="text" name="criterio" th:value="${criterio}" placeholder="Buscar...">
    <button type="submit">Buscar</button>
    <a th:href="@{/proyectos}">Limpiar</a>
</form>

<br>

<table border="1" cellpadding="6">
    <thead>
        <tr>
            <th>Título</th>
            <th>Estado</th>
            <th>Fecha inicio</th>
            <th>Fecha fin</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="p : ${proyectos}">
            <td th:text="${p.titulo}"></td>
            <td th:text="${p.estado}"></td>
            <td th:text="${p.fechaInicio}"></td>
            <td th:text="${p.fechaFin}"></td>
            <td>
                <a th:href="@{/proyectos/{id}(id=${p.id})}">Ver</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(proyectos)}">
            <td colspan="5">No hay proyectos.</td>
        </tr>
    </tbody>
</table>

</body>
</html>
