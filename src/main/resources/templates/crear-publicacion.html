<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>GIPF — Nueva publicación</title>
</head>
<body>

<h1>Nueva publicación</h1>

<form th:action="@{/mis-publicaciones/crear}" method="post">
    <label for="titulo">Título:</label><br>
    <input id="titulo" type="text" name="titulo" required size="60"><br><br>

    <label for="contenido">Contenido:</label><br>
    <textarea id="contenido" name="contenido" rows="8" cols="60" required></textarea><br><br>

    <button type="submit">Crear publicación</button>
    <a th:href="@{/mis-publicaciones}">Cancelar</a>
</form>

</body>
</html>
