<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>GIPF — Nuevo investigador</title>
</head>
<body>

<h1>Nuevo investigador</h1>

<form th:action="@{/investigadores/nuevo}" th:object="${investigador}" method="post">

    <label for="nombre">Nombre *</label><br>
    <input type="text" id="nombre" th:field="*{nombre}" required><br><br>

    <label for="apellidos">Apellidos</label><br>
    <input type="text" id="apellidos" th:field="*{apellidos}"><br><br>

    <label for="username">Usuario *</label><br>
    <input type="text" id="username" th:field="*{username}" required><br><br>

    <label for="password">Contraseña *</label><br>
    <input type="password" id="password" th:field="*{password}" required><br><br>

    <label for="campo">Campo de investigación *</label><br>
    <input type="text" id="campo" th:field="*{campo}" required><br><br>

    <label for="carrera">Carrera</label><br>
    <input type="text" id="carrera" th:field="*{carrera}"><br><br>

    <label for="master">Máster</label><br>
    <input type="text" id="master" th:field="*{master}"><br><br>

    <label for="email">Email</label><br>
    <input type="email" id="email" th:field="*{email}"><br><br>

    <label for="institucion">Institución</label><br>
    <input type="text" id="institucion" th:field="*{institucion}"><br><br>

    <button type="submit">Guardar</button>
    <a th:href="@{/investigadores}">Cancelar</a>
</form>

</body>
</html>
