<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>GIPF — Eliminar recompensa</title>
</head>
<body>

<h1>Eliminar recompensa</h1>

<p>¿Seguro que deseas eliminar la siguiente recompensa?</p>

<dl>
    <dt>Título</dt>
    <dd th:text="${recompensa.titulo}"></dd>

    <dt>Tipo</dt>
    <dd th:text="${recompensa.tipo}"></dd>

    <dt>Valor</dt>
    <dd th:text="${recompensa.valor}"></dd>

    <dt>Destinatario</dt>
    <dd th:text="${recompensa.destinatario.nombre + ' ' + recompensa.destinatario.apellidos}"></dd>
</dl>

<form th:action="@{/recompensas/{id}/eliminar(id=${recompensa.id})}" method="post">
    <button type="submit">Sí, eliminar</button>
</form>

<p><a th:href="@{/recompensas/{id}(id=${recompensa.id})}">Cancelar</a></p>

</body>
</html>
