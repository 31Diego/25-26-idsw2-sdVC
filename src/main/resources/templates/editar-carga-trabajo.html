<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>GIPF — Editar carga de trabajo</title>
</head>
<body>

<h1>Editar carga de trabajo</h1>

<div th:if="${investigador != null}">
    <p>Editando carga de: <strong th:text="${investigador.nombre + ' ' + investigador.apellidos}"></strong></p>
</div>

<form th:action="${investigador != null} ? @{/investigadores/{id}/carga-trabajo/editar(id=${investigador.id})} : @{/carga-trabajo/editar}"
      method="post">

    <label>Docencia (h/sem):
        <input type="number" step="0.5" min="0" name="horasDocencia"
               th:value="${carga.horasDocencia}" required>
    </label>
    <br>
    <label>Investigación (h/sem):
        <input type="number" step="0.5" min="0" name="horasInvestigacion"
               th:value="${carga.horasInvestigacion}" required>
    </label>
    <br>
    <label>Actividades académicas (h/sem):
        <input type="number" step="0.5" min="0" name="horasActividades"
               th:value="${carga.horasActividades}" required>
    </label>
    <br><br>

    <button type="submit">Guardar</button>
    <a th:href="${investigador != null} ? @{/coordinador/carga-trabajo} : @{/carga-trabajo}">Cancelar</a>
</form>

</body>
</html>
