<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi perfil — FUNIBER GIPF</title>
</head>
<body>

<h1>Mi perfil</h1>

<dl>
    <dt>Nombre</dt>         <dd th:text="${investigador.nombre}"></dd>
    <dt>Apellidos</dt>      <dd th:text="${investigador.apellidos}"></dd>
    <dt>Email</dt>          <dd th:text="${investigador.email}"></dd>
    <dt>Institución</dt>    <dd th:text="${investigador.institucion}"></dd>
    <dt>Especialización</dt><dd th:text="${investigador.especializacion}"></dd>
    <dt>Intereses</dt>      <dd th:text="${investigador.intereses}"></dd>
    <dt>Experiencia</dt>    <dd th:text="${investigador.experiencia}"></dd>
</dl>

<a th:href="@{/perfil/editar}">Editar perfil</a>
<a th:href="@{/solicitar-eliminacion}">Solicitar eliminación de perfil</a>
<a th:href="@{/panel}">Volver al panel principal</a>

</body>
</html>
