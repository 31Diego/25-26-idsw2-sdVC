<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>GIPF — Editar proyecto</title>
</head>
<body>

<h1>Editar proyecto</h1>

<form th:action="@{/proyectos/{id}/editar(id=${proyecto.id})}" th:object="${proyecto}" method="post">

    <label for="titulo">Título *</label><br>
    <input type="text" id="titulo" th:field="*{titulo}" required><br><br>

    <label for="descripcion">Descripción</label><br>
    <textarea id="descripcion" th:field="*{descripcion}" rows="4" cols="50"></textarea><br><br>

    <label for="objetivos">Objetivos</label><br>
    <textarea id="objetivos" th:field="*{objetivos}" rows="4" cols="50"></textarea><br><br>

    <label for="estado">Estado *</label><br>
    <select id="estado" th:field="*{estado}" required>
        <option value="EN_PROPUESTA" th:selected="${proyecto.estado == 'EN_PROPUESTA'}">En propuesta</option>
        <option value="EN_CURSO" th:selected="${proyecto.estado == 'EN_CURSO'}">En curso</option>
        <option value="COMPLETADO" th:selected="${proyecto.estado == 'COMPLETADO'}">Completado</option>
        <option value="CANCELADO" th:selected="${proyecto.estado == 'CANCELADO'}">Cancelado</option>
    </select><br><br>

    <label for="fechaInicio">Fecha inicio</label><br>
    <input type="date" id="fechaInicio" th:field="*{fechaInicio}"><br><br>

    <label for="fechaFin">Fecha fin</label><br>
    <input type="date" id="fechaFin" th:field="*{fechaFin}"><br><br>

    <button type="submit">Guardar cambios</button>
    <a th:href="@{/proyectos/{id}(id=${proyecto.id})}">Cancelar</a>
</form>

</body>
</html>
