<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carga de trabajo — FUNIBER GIPF</title>
</head>
<body>

<h1>Carga de trabajo</h1>

<form method="get" th:action="@{/carga-trabajo}">
    <input type="text" name="criterio" th:value="${criterio}" placeholder="Buscar por nombre o disponibilidad..."/>
    <button type="submit">Filtrar</button>
    <a th:href="@{/carga-trabajo}">Limpiar</a>
</form>

<table>
    <thead>
        <tr>
            <th>Nombre</th>
            <th>Apellidos</th>
            <th>Disponibilidad</th>
            <th>Carga de trabajo</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="i : ${investigadores}">
            <td th:text="${i.nombre}"></td>
            <td th:text="${i.apellidos}"></td>
            <td th:text="${i.disponibilidad}"></td>
            <td th:text="${i.cargaTrabajo}"></td>
            <td><a th:href="@{/carga-trabajo/{id}/editar(id=${i.id})}">Editar</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(investigadores)}">
            <td colspan="5">No hay investigadores.</td>
        </tr>
    </tbody>
</table>

<a th:href="@{/panel}">Volver al panel principal</a>

</body>
</html>
