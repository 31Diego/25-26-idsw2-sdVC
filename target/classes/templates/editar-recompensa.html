<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>GIPF — Editar recompensa</title>
</head>
<body>

<h1>Editar recompensa</h1>

<p><a th:href="@{/recompensas/{id}(id=${recompensa.id})}">← Volver al detalle</a></p>

<form th:action="@{/recompensas/{id}/editar(id=${recompensa.id})}" method="post">

    <div>
        <label for="titulo">Título *</label><br>
        <input type="text" id="titulo" name="titulo" th:value="${recompensa.titulo}" required>
    </div>

    <div>
        <label for="tipo">Tipo *</label><br>
        <select id="tipo" name="tipo" required>
            <option value="Económica"    th:selected="${recompensa.tipo == 'Económica'}">Económica</option>
            <option value="Reconocimiento" th:selected="${recompensa.tipo == 'Reconocimiento'}">Reconocimiento</option>
            <option value="Tiempo libre" th:selected="${recompensa.tipo == 'Tiempo libre'}">Tiempo libre</option>
        </select>
    </div>

    <div>
        <label for="valor">Valor *</label><br>
        <input type="text" id="valor" name="valor" th:value="${recompensa.valor}" required>
    </div>

    <div>
        <label for="descripcion">Descripción</label><br>
        <textarea id="descripcion" name="descripcion" rows="4" cols="60" th:text="${recompensa.descripcion}"></textarea>
    </div>

    <div>
        <label for="condiciones">Condiciones</label><br>
        <textarea id="condiciones" name="condiciones" rows="4" cols="60" th:text="${recompensa.condiciones}"></textarea>
    </div>

    <div>
        <label for="destinatarioId">Destinatario *</label><br>
        <select id="destinatarioId" name="destinatarioId" required>
            <option th:each="inv : ${investigadores}"
                    th:value="${inv.id}"
                    th:text="${inv.nombre + ' ' + inv.apellidos}"
                    th:selected="${inv.id == recompensa.destinatario.id}"></option>
        </select>
    </div>

    <br>
    <button type="submit">Guardar cambios</button>
    <a th:href="@{/recompensas/{id}(id=${recompensa.id})}">Cancelar</a>
</form>

</body>
</html>
