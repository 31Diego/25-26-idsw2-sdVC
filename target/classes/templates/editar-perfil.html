<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar perfil — FUNIBER GIPF</title>
</head>
<body>

<h1>Editar perfil</h1>

<form method="post" th:action="@{/perfil}" th:object="${investigador}">
    <label>Nombre: <input type="text" th:field="*{nombre}"/></label><br/>
    <label>Apellidos: <input type="text" th:field="*{apellidos}"/></label><br/>
    <label>Email: <input type="email" th:field="*{email}"/></label><br/>
    <label>Institución: <input type="text" th:field="*{institucion}"/></label><br/>
    <label>Especialización: <input type="text" th:field="*{especializacion}"/></label><br/>
    <label>Intereses: <textarea th:field="*{intereses}"></textarea></label><br/>
    <label>Experiencia: <textarea th:field="*{experiencia}"></textarea></label><br/>
    <button type="submit">Guardar</button>
</form>

<a th:href="@{/perfil}">Cancelar</a>

</body>
</html>
