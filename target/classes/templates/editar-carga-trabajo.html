<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar carga de trabajo — FUNIBER GIPF</title>
</head>
<body>

<h1>Editar carga de trabajo</h1>
<h2 th:text="${investigador.nombre} + ' ' + ${investigador.apellidos}"></h2>

<form method="post" th:action="@{/carga-trabajo/{id}(id=${investigador.id})}"
      th:object="${investigador}">

    <label>Disponibilidad:
        <select th:field="*{disponibilidad}">
            <option value="Disponible">Disponible</option>
            <option value="Parcialmente disponible">Parcialmente disponible</option>
            <option value="No disponible">No disponible</option>
        </select>
    </label><br/>

    <label>Descripción de carga:
        <textarea th:field="*{cargaTrabajo}"></textarea>
    </label><br/>

    <button type="submit">Guardar</button>
</form>

<a th:href="@{/carga-trabajo}">Cancelar</a>
<a th:href="@{/panel}">Volver al panel principal</a>

</body>
</html>
