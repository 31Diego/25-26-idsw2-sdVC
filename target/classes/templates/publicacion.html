<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <title>GIPF — Publicación</title>
</head>
<body>

<h1 th:text="${publicacion.titulo}"></h1>

<p>
    <strong>Autor:</strong> <span th:text="${publicacion.autor.nombre + ' ' + publicacion.autor.apellidos}"></span>
    &nbsp;·&nbsp;
    <strong>Fecha:</strong> <span th:text="${publicacion.fecha}"></span>
</p>

<p th:text="${publicacion.contenido}"></p>

<div sec:authorize="hasRole('COORDINADOR')">
    <a th:href="@{/publicaciones/{id}/editar(id=${publicacion.id})}">Editar</a> |
    <a th:href="@{/publicaciones/{id}/eliminar(id=${publicacion.id})}">Eliminar</a>
</div>

<a th:href="@{/publicaciones}">Volver a publicaciones</a>

<hr>

<h2>Respuestas</h2>

<div th:if="${#lists.isEmpty(publicacion.respuestas)}">
    <p>No hay respuestas todavía.</p>
</div>

<div th:each="resp : ${publicacion.respuestas}">
    <p>
        <strong th:text="${resp.autor.nombre + ' ' + resp.autor.apellidos}"></strong>
        · <span th:text="${resp.fecha}"></span>
    </p>
    <p th:text="${resp.contenido}"></p>
    <hr>
</div>

<h3>Responder</h3>
<form th:action="@{/publicaciones/{id}/responder(id=${publicacion.id})}" method="post">
    <textarea name="contenido" rows="4" cols="60" placeholder="Escribe tu respuesta..." required></textarea>
    <br><br>
    <button type="submit">Enviar respuesta</button>
    <a th:href="@{/publicaciones/{id}(id=${publicacion.id})}">Cancelar</a>
</form>

</body>
</html>
