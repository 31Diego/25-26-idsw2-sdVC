<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión — FUNIBER GIPF</title>
</head>
<body>

<h1>FUNIBER GIPF</h1>
<h2>Iniciar sesión</h2>

<p th:if="${param.error}" style="color:red">Usuario o contraseña incorrectos.</p>
<p th:if="${param.logout}">Sesión cerrada correctamente.</p>

<form method="post" th:action="@{/login}">
    <label>Usuario: <input type="text" name="username" autofocus/></label><br/>
    <label>Contraseña: <input type="password" name="password"/></label><br/>
    <button type="submit">Entrar</button>
</form>

</body>
</html>
