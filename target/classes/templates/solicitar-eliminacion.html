<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>GIPF — Solicitar eliminación</title>
</head>
<body>

<h1>Solicitar eliminación de perfil</h1>

<p>Vas a solicitar la eliminación del perfil de
    <strong th:text="${investigadorDestino.nombre + ' ' + (investigadorDestino.apellidos != null ? investigadorDestino.apellidos : '')}"></strong>.
</p>

<form th:action="@{/investigadores/{id}/solicitar-eliminacion(id=${investigadorDestino.id})}" method="post">
    <label for="motivo">Motivo:</label><br>
    <textarea id="motivo" name="motivo" rows="4" cols="50" required></textarea>
    <br><br>
    <button type="submit">Enviar solicitud</button>
</form>

<br>
<a th:href="@{/investigadores/{id}/opciones(id=${investigadorDestino.id})}">Cancelar</a>

</body>
</html>
